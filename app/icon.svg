<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Navy Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cap Top Teal Gradient -->
    <linearGradient id="capTopGrad" x1="128" y1="52" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Cap Base/Under Dark Teal Gradient -->
    <linearGradient id="capBaseGrad" x1="128" y1="120" x2="128" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Metallic Gold Tassel Gradient -->
    <linearGradient id="tasselGrad" x1="128" y1="84" x2="176" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Realistic Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Card Background -->
  <rect width="256" height="256" rx="64" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="128" cy="130" r="70" fill="#14b8a6" opacity="0.1" filter="blur(20px)" />

  <!-- Main Cap Group with Realistic Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Cap Headband / Underside Base -->
    <path d="M84 142C84 168 103 184 128 184C153 184 172 168 172 142V124H84V142Z" fill="url(#capBaseGrad)" />
    
    <!-- Inner Headband Shadow Line -->
    <path d="M92 140C92 162 107 174 128 174C149 174 164 162 164 140V130H92V140Z" fill="#042f2e" opacity="0.4" />

    <!-- Cap Top Diamond / Mortarboard -->
    <path d="M128 52L232 100L128 148L24 100L128 52Z" fill="url(#capTopGrad)" />

    <!-- Top Cap Bevel Highlight (3D Effect) -->
    <path d="M128 54L228 100L128 144L28 100L128 54Z" stroke="#2dd4bf" stroke-width="2" stroke-linejoin="round" fill="none" opacity="0.6" />

    <!-- Center Button on Mortarboard -->
    <circle cx="128" cy="100" r="8" fill="#0f766e" />
    <circle cx="128" cy="99" r="5" fill="#2dd4bf" />

    <!-- Tassel String and Pendant -->
    <!-- Tassel Anchor Point -->
    <path d="M128 100L172 164" stroke="url(#tasselGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Tassel Loop Highlight -->
    <path d="M128 100L172 164" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

    <!-- Hanging Tassel Knob / Pendant with Shadow -->
    <circle cx="172" cy="172" r="10" fill="#b45309" />
    <circle cx="172" cy="170" r="8" fill="url(#tasselGrad)" />
    <circle cx="170" cy="168" r="3" fill="#fde68a" opacity="0.9" />
  </g>
</svg>