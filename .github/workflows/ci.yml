name: UCAG CI & Deployment Preview Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Start Firestore emulator
        run: |
          npx --yes firebase-tools@latest emulators:start --only firestore --project demo-ucag-rules-test > /tmp/ucag-firestore-emulator.log 2>&1 &
          echo $! > /tmp/ucag-firestore-emulator.pid
          for i in {1..30}; do
            if nc -z 127.0.0.1 8080; then
              echo "Firestore emulator is ready."
              break
            fi
            sleep 2
          done
          if ! nc -z 127.0.0.1 8080; then
            cat /tmp/ucag-firestore-emulator.log
            exit 1
          fi

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Production Build Verification
        run: npm run build
        env:
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"
          CRON_SECRET: "ci-test-secret"
