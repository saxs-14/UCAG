name: UCAG CI & Deployment Preview Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Least-privilege default: nothing in this workflow pushes commits, opens
# PRs, or writes issues/packages, so the GITHUB_TOKEN handed to every step
# (including the third-party gitleaks action below) gets read-only repo
# access rather than the default read-write.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # gitleaks needs real commit history to diff against (it computes
          # a range like <before>^..<after>) -- actions/checkout's default
          # fetch-depth: 1 only fetches the single latest commit, with no
          # parent at all, so that range is unresolvable ("unknown
          # revision") on a shallow checkout. Confirmed failing both on a
          # pull_request event (ef971e4^ literally didn't exist locally)
          # and on a push right after a force-push/history rewrite (the
          # recorded "before" SHA no longer existed at all). Full history
          # makes both cases resolve correctly regardless of event type or
          # what happened to the branch just before this run.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # firebase-tools requires Java 21+ as of its own 15.x line --
          # bump this if a future firebase-tools major again raises the
          # floor (check `npm view firebase-tools engines` alongside the
          # pinned version below).
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # Scans this push/PR's own diff for accidentally-committed secrets
      # (API keys, service-account JSON, etc.) -- a second, automated
      # backstop behind the .gitignore + "only .env.example is tracked"
      # check already done by hand each session, per CLAUDE.md's non-
      # negotiable "secrets never reach the browser" (and, by extension,
      # never reach the repo either).
      - name: Scan for committed secrets (gitleaks)
        # Pinned to v3.0.0's commit SHA, not the floating "@v2"/"@v3" tag --
        # a mutable major-version tag on a third-party action is a supply-
        # chain foot-gun (the maintainer, or anyone who compromises their
        # account, can repoint it to different code with no corresponding
        # change in this repo's history). The version comment is just for
        # human/Dependabot readability; the SHA is what actually runs.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # High/critical advisories fail the build; npm audit's own moderate-
      # and-below noise (frequently un-actionable transitive dev-dependency
      # findings with no real fix available yet) would otherwise train
      # everyone to ignore a red CI check entirely.
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Start Firestore emulator
        run: |
          # Pinned, not @latest -- an unpinned firebase-tools can silently
          # raise its own Java/Node floor between CI runs with no change
          # to this repo at all (this is exactly how this step broke:
          # `emulators:start` started requiring Java 21 with no warning).
          npx --yes firebase-tools@15.31.0 emulators:start --only firestore --project demo-ucag-rules-test > /tmp/ucag-firestore-emulator.log 2>&1 &
          echo $! > /tmp/ucag-firestore-emulator.pid
          for i in {1..30}; do
            if nc -z 127.0.0.1 8080; then
              echo "Firestore emulator is ready."
              break
            fi
            sleep 2
          done
          if ! nc -z 127.0.0.1 8080; then
            cat /tmp/ucag-firestore-emulator.log
            exit 1
          fi

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Production Build Verification
        run: npm run build 2>&1 | tee build-output.log
        env:
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"
          CRON_SECRET: "ci-test-secret"

      - name: Calculator route bundle budget
        run: npm run check:bundle-budget -- build-output.log

      # chromium only -- both projects in playwright.config.ts run on the
      # chromium engine; "mobile-chrome-3g" is a Pixel 7 device/network
      # emulation layered on top of it, not a separate browser.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The Firestore emulator started above is otherwise empty: the
      # "demo-ucag" project tests/e2e/ runs against (lib/firebase/client.ts,
      # lib/firebase/admin.ts) never gets a single document written to it,
      # so calculator-to-apply.spec.ts and ump-platform.spec.ts were
      # guaranteed to fail on any real run regardless of local state --
      # discovered when CI failed on commit 3a2def6. These two seed
      # scripts are pure static data (no network/AI calls), so they're
      # safe to run directly with env vars instead of --env-file=.env.local
      # (there is no .env.local in CI).
      - name: Seed E2E fixture data into the Firestore emulator
        run: |
          npx tsx scripts/seed-ump-data.mts
          npx tsx scripts/seed-real-aps-rules.mts
        env:
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"

      # tests/e2e/ existed with real coverage (the calculator-to-apply
      # journey, the UMP platform) but was never run anywhere but a
      # developer's own machine -- wired in here so a regression in
      # either flow actually fails CI instead of shipping unnoticed.
      # Reuses the same Firestore emulator already started above;
      # playwright.config.ts's own webServer spins up `npm run dev`
      # with NEXT_PUBLIC_USE_FIREBASE_EMULATOR already set.
      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
